<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Europcar · Interaktive Präsentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfaf8;--panel:#ffffff;--ink:#1a1a1a;--quiet:#6b6b6b;--line:#e3e0da;--soft:#f3f1ec;
  --flow:#13804f;--leak:#b8650f;--gate:#3f46b0;--gate-bg:#eef0fb;--dim:#b9b5ad;
  --s1:#5d7899;--s2:#4f8a8c;--s3:#7f7aa8;--s4:#a08a5a;--s5:#a07068;
  --top:56px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
/* ---------- top bar ---------- */
.top{position:fixed;inset:0 0 auto 0;height:var(--top);z-index:50;display:flex;align-items:center;gap:16px;padding:0 18px;
  background:rgba(251,250,248,.92);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left}
.mono{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--panel);display:grid;place-items:center;font-weight:800;font-size:.78rem;letter-spacing:.02em;flex:none}
.brand .mono{display:grid}
.brand b{display:block;font-size:.84rem;line-height:1.2}
.brand span{display:block;font-size:.7rem;color:var(--quiet);line-height:1.2;white-space:nowrap}
.tabs{display:flex;gap:4px;margin:0 auto;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.tabs button{font:inherit;font-size:.78rem;font-weight:600;color:var(--quiet);background:transparent;border:0;border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--ink);color:var(--panel)}
.tabs .n{font-family:"JetBrains Mono",monospace;font-size:.68rem;opacity:.6}
.tbtn{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.tbtn:hover{border-color:var(--ink)}
.tbtn svg{width:15px;height:15px}
@media (max-width:980px){.brand span{display:none}}
@media (max-width:820px){.tabs .t{display:none}.brand b{display:none}}
/* ---------- views ---------- */
.view{position:fixed;inset:var(--top) 0 0 0;display:none}
.view.on{display:block}
.view iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
#welcome{overflow-y:auto}
/* ---------- welcome ---------- */
.hero{max-width:1120px;margin:0 auto;padding:clamp(14px,2.5vh,40px) 20px 12px}
.kick{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--quiet);display:flex;align-items:center;gap:10px}
.kick i{display:inline-block;width:22px;height:2px;background:var(--ink)}
h1{font-size:clamp(1.6rem,3vw,2.4rem);line-height:1.08;letter-spacing:-.03em;font-weight:800;margin:10px 0 0}
.lead{font-size:clamp(.98rem,1.4vw,1.1rem);color:var(--quiet);max-width:62ch;margin:0}
.lead b{color:var(--ink);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin:22px 0 0;font-size:.82rem;color:var(--quiet)}
.meta span{display:inline-flex;align-items:center;gap:7px}
.meta i{width:6px;height:6px;border-radius:50%;background:var(--flow);display:inline-block}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:clamp(14px,2.5vh,32px) 0 10px;flex-wrap:wrap}
.sect h2{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--quiet);margin:0}
.sect p{margin:0;font-size:.8rem;color:var(--quiet)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.cards{grid-template-columns:1fr}}
.card{position:relative;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:0;cursor:pointer;overflow:hidden;
  transition:border-color .2s,transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s;animation:rise .6s cubic-bezier(.2,.7,.2,1) both;display:flex;flex-direction:column}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
.card:hover,.card:focus-visible{border-color:var(--ink);transform:translateY(-3px);box-shadow:0 14px 30px rgba(20,20,20,.08);outline:none}
.art{height:150px;background:var(--soft);border-bottom:1px solid var(--line);display:block;width:100%}
.cb{padding:10px 14px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.q{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--quiet);display:flex;justify-content:space-between;gap:8px}
.q .f{font-family:"JetBrains Mono",monospace;letter-spacing:0;text-transform:none}
.card h3{margin:2px 0 0;font-size:1.04rem;letter-spacing:-.015em}
.card p{margin:0;font-size:.82rem;line-height:1.4;color:var(--quiet)}
.go{margin-top:auto;padding-top:2px;display:flex;align-items:center;justify-content:space-between;font-size:.8rem;font-weight:600}
.go .arrow{width:24px;height:24px;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;transition:background .2s,color .2s,border-color .2s}
.card:hover .go .arrow{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.closing{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px 18px;border:1px dashed var(--dim);border-radius:14px;font-size:.86rem;color:var(--quiet);animation:rise .6s .24s cubic-bezier(.2,.7,.2,1) both}
.closing b{color:var(--ink)}
.closing .num{font-family:"JetBrains Mono",monospace;font-size:.72rem;font-weight:700;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--panel)}
kbd{font-family:"JetBrains Mono",monospace;font-size:.7rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel);color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* art animations */
.route-dot{offset-path:path('M24 112 C 90 112, 110 52, 170 60 S 260 108, 330 44');animation:drive 4.5s cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes drive{0%{offset-distance:0%}70%,100%{offset-distance:100%}}
.flow-dot{animation:flow 3.2s linear infinite}
@keyframes flow{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
.team-dash{animation:team 1s linear infinite}
@keyframes team{from{stroke-dashoffset:18}to{stroke-dashoffset:0}}
.bar-g{transform-box:fill-box;transform-origin:bottom;animation:grow 3.6s cubic-bezier(.2,.7,.2,1) -1.3s infinite}
@keyframes grow{0%{transform:scaleY(.15)}35%,85%{transform:scaleY(1)}100%{transform:scaleY(.15)}}
@media (prefers-reduced-motion:reduce){.card,.closing,.route-dot,.flow-dot,.team-dash,.bar-g{animation:none}}
.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(10px);z-index:60;background:var(--ink);color:var(--panel);font-size:.78rem;font-weight:600;padding:8px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.hint.show{opacity:1;transform:translateX(-50%)}
.cards{grid-template-columns:repeat(6,minmax(0,1fr))}
.cards .card{grid-column:span 2}.cards .card:nth-child(4){grid-column:2 / span 2}
@media (max-width:900px){.cards{grid-template-columns:1fr}.cards .card,.cards .card:nth-child(4){grid-column:auto}}
.card:nth-child(4){animation-delay:.24s}.card:nth-child(5){animation-delay:.32s}
.card.ec .q{color:#1d4e89}
.art{height:clamp(80px,calc(20vh - 56px),130px)}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.9}50%{transform:scale(1.15);opacity:.4}}
.gnav{display:inline-flex;align-items:center;gap:6px;flex:none}
.gnav span{font-family:"JetBrains Mono",monospace;font-size:.76rem;color:var(--quiet);min-width:44px;text-align:center}
.gstrip{position:fixed;left:0;right:0;top:var(--top);height:3px;z-index:49;background:transparent}
.gstrip i{display:block;height:100%;background:var(--gate);width:0;transition:width .35s cubic-bezier(.2,.7,.2,1)}
@media (max-width:1100px){.tabs .t{display:none}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.card .art *{animation-play-state:paused}
.card:hover .art *,.card:focus-visible .art *{animation-play-state:running}
</style>
</head>

<header class="top">
  <button class="brand" id="home" aria-label="Zur Startseite"><span class="mono">JA</span><span><b>Jorge Aguilar</b><span>Head of Fleet Planning &amp; Lifecycle Management</span></span></button>

<main>

\n<body>\n<div class=\"wrap\">\n<div class=\"bar\" id=\"bar\"><\/div>\n\n<div id=\"stage\">\n  <div class=\"caption\">\n    <div><div class=\"ct\" id=\"capT\"><\/div><div class=\"ch\" id=\"capH\"><\/div><\/div>\n    <div class=\"nav\"><button id=\"prev\" aria-label=\"Zurück\">&larr;<\/button><span id=\"capN\"><\/span><button id=\"next\" aria-label=\"Weiter\">&rarr;<\/button><i class=\"sep\" aria-hidden=\"true\"><\/i><button id=\"fsb\" aria-label=\"Vollbild\" title=\"Vollbild (F)\"><\/button><\/div>\n  <\/div>\n  <div class=\"board\">\n    <div class=\"left\" id=\"left\"><\/div>\n    <div class=\"right\">\n      <div class=\"kpis\" id=\"kpis\"><\/div>\n      <div class=\"gridhead\"><b>48 Fahrzeuge<\/b><span id=\"gridmode\"><\/span><\/div>\n      <div class=\"fleet\" id=\"fleet\"><\/div>\n      <div class=\"legend\" id=\"legend\"><\/div>\n    <\/div>\n  <\/div>\n  <p class=\"key note2\"><span><b style=\"color:var(--ink)\">Illustratives Modell, keine Kundendaten.<\/b> Fiktive Flotte mit 48 Fahrzeugen; Werte je Fahrzeug-Tag aus dem illustrativen Nexio Partner P&amp;L Cockpit, Streuung simuliert. Beschlossen ist nur der Mindestlohn: 13,90 € (2026), 14,60 € ab 01.01.2027.<\/span><\/p>\n  <div class=\"drawer\" id=\"drawer\">\n    <button class=\"dh\" id=\"dh\" aria-expanded=\"false\" aria-controls=\"detail\"><span class=\"dt\" id=\"dTag\">Fahrzeug-P&amp;L<\/span><span class=\"dn\" id=\"dName\"><\/span><span class=\"dhero\" id=\"dHero\"><\/span><span class=\"dhint\" id=\"dHint\">Details einblenden<\/span><span class=\"dchev\"><svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 10l4-4 4 4\"/><\/svg><\/span><\/button>\n    <div id=\"detail\" aria-live=\"polite\"><\/div>\n  <\/div>\n<\/div>\n<\/div>\n\n<script>\n(function(){\n/* ================= model ================= */\nvar MD=30.4,G0=393.1,DRV0=221.8,VAR=30,FIX=42,FIXNEW=48;\nfunction rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\nvar R=rng(42),V=[];\nfor(var i=0;i<48;i++){var age=Math.round(3+R()*42),km=Math.round(age*6150*(0.85+R()*0.3));\n  var ws=km>180000?1+R()*3:R()*1.2,gap=R()<0.3?2+R()*5:R()*1.5;\n  var idle=Math.min(12,ws+gap+0.8),d=+(MD-idle).toFixed(1);\n  var G=393.1*(0.97+R()*0.09),dmg=R()<.15?150+R()*450:0,rep=Math.max(0,(km-150000))*0.0028+dmg;\n  V.push({i:i,id:'F-'+String(i+1).padStart(2,'0'),age:age,km:km,d:d,ws:+ws.toFixed(1),gap:+gap.toFixed(1),G:G,rep:Math.round(rep),dmg:Math.round(dmg)})}\nvar BASE={mw:13.9,c:22.5,up:0,plus:0,repl:0};\nvar P=JSON.parse(JSON.stringify(BASE));\nfunction beDays(p){var g=G0*(1+(p.up||0)/100);return FIX*MD/(g*(1-p.c/100)-DRV0*p.mw/13.9-VAR)}\nvar BE0=beDays(BASE);\nfunction calc(v,p){var d=v.d,fixD=FIX,rep=v.rep,newv=false;\n  if(p.plus&&v.d<BE0)d=Math.min(29.5,v.d+p.plus);\n  if(p.repl&&v.km>p.repl){fixD=FIXNEW;rep=0;newv=true}\n  var g=v.G*(1+(p.up||0)/100),rev=g*d,comm=rev*p.c/100,drv=DRV0*(p.mw/13.9)*d,vr=VAR*d,db=rev-comm-drv-vr,\n      fixA=fixD*d,fixI=fixD*(MD-d),fix=fixA+fixI,res=db-fix-rep;\n  return{d:d,idle:MD-d,rev:rev,comm:comm,drv:drv,vr:vr,db:db,fixA:fixA,fixI:fixI,fix:fix,rep:rep,res:res,\n    veh:fix+vr+rep,perDay:(fix+vr+rep)/d,newv:newv}}\nfunction fleet(p){var t={rev:0,comm:0,drv:0,vr:0,db:0,fix:0,fixI:0,rep:0,res:0,neg:0,d:0,veh:0};\n  V.forEach(function(v){var r=calc(v,p);for(var k in t)if(k!=='neg'&&k!=='d')t[k]+=r[k];t.d+=r.d;if(r.res<0)t.neg++});t.d/=V.length;return t}\nvar F0=fleet(BASE);\n\n/* ================= helpers ================= */\nfunction eur(v,d){d=d||0;var s=Math.abs(v).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});return(v<0?'−':'')+s+' €'}\nfunction eurS(v){return(v>0?'+':'')+eur(v)}\nfunction num(v,d){return v.toLocaleString('de-DE',{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}\nfunction css(k){return getComputedStyle(document.documentElement).getPropertyValue(k).trim()}\nfunction hex2(h){h=h.replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');var n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}\nfunction mix(a,b,t){var A=hex2(a),B=hex2(b);return'rgb('+A.map(function(x,i){return Math.round(x+(B[i]-x)*t)}).join(',')+')'}\nfunction lum(c){var m=c.match(/\\d+/g);if(!m)return 1;return(.299*m[0]+.587*m[1]+.114*m[2])/255}\n\n/* ================= steps ================= */\nvar STEPS=[\n {t:'Die Fragen',h:'Welche Informationen brauchen Flottenbetreiber für bessere wirtschaftliche Entscheidungen?',\n  cue:'Ein wichtiger Teil meiner Arbeit ist es, herauszufinden, welche Informationen Flottenbetreiber für bessere wirtschaftliche Entscheidungen brauchen.'},\n {t:'01 · TCO je Fahrzeug',h:'Wie hoch sind die Gesamtkosten pro Fahrzeug, und was treibt sie?',\n  cue:'Zum Beispiel: Wie hoch sind die Gesamtkosten pro Fahrzeug?'},\n {t:'02 · Flotten-P&L',h:'Welche Kosten beeinflussen die Profitabilität?',\n  cue:'Welche Kosten beeinflussen die Profitabilität?'},\n {t:'Standzeit & Auslastung',h:'Welche Rolle spielen Wartung, Standzeiten und Auslastung?',\n  cue:'Und welche Rolle spielen Wartung, Standzeiten und Auslastung?'},\n {t:'03 · Szenarien',h:'Kennzahlen, TCO- und P&L-Analysen sowie Szenarien je nach Kundenbedarf.',\n  cue:'Je nach Kundenbedarf entwickeln wir passende Kennzahlen, Analysen für TCO und P&L sowie individuelle Funktionen und Szenarien.'},\n {t:'Mein Beitrag',h:'Fragestellungen klären, Datenbedarf definieren, Analysen priorisieren.',\n  cue:'Mein Beitrag ist es, mit den Flottenbetreibern die Fragestellungen zu klären, den Datenbedarf zu definieren und gemeinsam mit den BI-Spezialisten die Analysen zu priorisieren.'},\n {t:'Brücke zu Europcar',h:'Genau hier sehe ich die Verbindung zu Fleet Planning und Lifecycle Management.',\n  cue:'Genau hier sehe ich eine wichtige Verbindung zu Fleet Planning und Lifecycle Management bei Europcar.'}\n];\nvar step=0,sel=null;\n\n/* ================= right panel ================= */ h='<div class=\"fade\"><h4>01 · Fleet Economics: TCO je Fahrzeug<\/h4><p class=\"lead\">Die Kosten pro Fahrzeug und Monat sind ähnlich. Der Unterschied liegt darin, wie viele davon an <b class=\"neg\">Standtagen<\/b> anfallen und wie viel <b style=\"color:var(--rep)\">Reparaturen<\/b> ältere Fahrzeuge kosten. Je Einsatztag gerechnet wird das sichtbar.<\/p>'+chartTCO()+'<\/div>'}\n  else if(step===2){h='<div class=\"fade\"><h4>02 · Flotten-P&amp;L'+(sel!=null?' <span class=\"chip\">'+V[sel].id+'<\/span> <button class=\"chip\" id=\"backFleet\" style=\"cursor:pointer;background:transparent\">← Flotte<\/button>':'')+'<\/h4><p class=\"lead\">Fahrer und Provision nehmen den größten Teil des Umsatzes. Was bleibt, muss die Fixkosten an <i>allen<\/i> Kalendertagen tragen. Klick auf ein Fahrzeug rechts zeigt seine eigene P&amp;L.<\/p>'+chartWaterfall(sel)+'<\/div>'}\n  else if(step===3){h='<div class=\"fade\"><h4>Standzeit &amp; Auslastung: der eigentliche Hebel<\/h4><p class=\"lead\">Unter rund '+num(BE0,0)+' Einsatztagen im Monat verliert ein Fahrzeug Geld. '+F0.neg+' von 48 Fahrzeugen liegen dort, meist wegen Werkstatt- und Standtagen oder hoher Laufleistung.<\/p>'+chartScatter()+'<\/div>'}\n  else if(step===4){h='<div class=\"fade\"><h4>03 · Szenarien &amp; Modelle<\/h4><p class=\"lead\">Was passiert mit dem Ergebnis, wenn sich Kosten ändern, und welche Hebel gleichen das aus?<\/p>'+\n    '<div class=\"presets\"><button data-pre=\"mw\">Mindestlohn 2027<\/button><button data-pre=\"counter\">Mindestlohn 2027 + Gegenmaßnahmen<\/button><button data-pre=\"reset\">Zurücksetzen<\/button><\/div>'+\n    '<div class=\"ctrl\"><div class=\"c\"><label>Mindestlohn <span id=\"o_mw\"><\/span><\/label><div class=\"seg\" id=\"segmw\"><button data-mw=\"13.9\">13,90 € (2026)<\/button><button data-mw=\"14.6\">14,60 € (2027)<\/button><\/div><small>Beschlossen. Wirkt auf jeden Einsatztag.<\/small><\/div>'+\n    '<div class=\"c\"><label>Provision Plattform <span id=\"o_c\"><\/span><\/label><input type=\"range\" id=\"i_c\" min=\"18\" max=\"27\" step=\"0.5\"><small>Mix aus Plattformen und Konditionen<\/small><\/div>'+\n    '<div class=\"c\"><label>Umsatz je Einsatztag <span id=\"o_up\"><\/span><\/label><input type=\"range\" id=\"i_up\" min=\"0\" max=\"5\" step=\"0.5\"><small>z. B. Schichten auf Nachfragespitzen legen<\/small><\/div>'+\n    '<div class=\"c\"><label>Standzeit senken <span id=\"o_plus\"><\/span><\/label><input type=\"range\" id=\"i_plus\" min=\"0\" max=\"4\" step=\"0.5\"><small>mehr Einsatztage für Fahrzeuge unter Break-even<\/small><\/div>'+\n    '<div class=\"c\"><label>Fahrzeuge ersetzen ab <span id=\"o_repl\"><\/span><\/label><div class=\"seg\" id=\"segrepl\"><button data-r=\"0\">nie<\/button><button data-r=\"250000\">250.000 km<\/button><button data-r=\"200000\">200.000 km<\/button><button data-r=\"175000\">175.000 km<\/button><\/div><small>Neufahrzeug: 48 € statt 42 € fix pro Tag, keine Zusatzreparaturen<\/small><\/div><\/div>'+\n    '<div id=\"bridge\">'+chartBridge()+'<\/div><\/div>'}\n  else if(step===5){h='<div class=\"fade\"><h4>Mein Beitrag in diesem Fall<\/h4><p class=\"lead\">Die Analyse beginnt nicht mit den Daten, sondern mit der Frage des Betreibers. Gemeinsam mit den BI-Spezialisten entscheiden wir, was zuerst gebaut wird.<\/p>'+\n    '<div class=\"flowrow\">'+\n    '<div class=\"st fade\" style=\"animation-delay:0ms\"><span class=\"who\">Mit dem Betreiber<\/span><b>1 · Fragestellung klären<\/b><ul><li>Welche Fahrzeuge verlieren Geld, und warum?<\/li><li>Was kostet uns der Mindestlohn 2027?<\/li><li>Wann ersetzen wir ein Fahrzeug?<\/li><\/ul><\/div>'+\n    '<div class=\"st fade\" style=\"animation-delay:120ms\"><span class=\"who\">Mit Betreiber &amp; Produkt<\/span><b>2 · Datenbedarf definieren<\/b><ul><li>Fahrten und Umsatz je Fahrzeug (Plattformen)<\/li><li>Schichten und Fahrerkosten<\/li><li>Werkstatttage, Reparaturen, Schäden<\/li><li>Leasing, Versicherung, Stellplatz<\/li><\/ul><\/div>'+\n    '<div class=\"st fade\" style=\"animation-delay:240ms\"><span class=\"who\">Mit den BI-Spezialisten<\/span><b>3 · Analysen priorisieren<\/b><ul><li>1. Fahrzeug-P&amp;L monatlich: hoher Nutzen, Daten vorhanden<\/li><li>2. Standzeit-Analyse nach Grund<\/li><li>3. Ersatzzeitpunkt nach Laufleistung<\/li><li>4. Szenarien: Lohn, Provision<\/li><\/ul><\/div>'+\n    '<div class=\"st op fade\" style=\"animation-delay:360ms\"><span class=\"who\">Beim Betreiber<\/span><b>4 · Entscheidung &amp; Umsetzung<\/b><ul><li>Monatliches Fahrzeug-Review<\/li><li>Standtage nach Ursache steuern<\/li><li>Ersatzplanung statt Reparatur ohne Ende<\/li><li>Budget mit Szenarien<\/li><\/ul><\/div><\/div>'+\n    '<p style=\"font-size:.82rem;color:var(--quiet);margin:0\">Meine Rolle: die operative Frage in eine Analyse übersetzen und die Reihenfolge festlegen. Die BI-Spezialisten bauen Modelle und Auswertungen, der Betreiber entscheidet.<\/p><\/div>'}\n  else if(step===6){h='<div class=\"fade\"><h4>Was davon für Fleet Planning &amp; Lifecycle Management übertragbar ist<\/h4><p class=\"lead\">Die Methode lässt sich übertragen, die Zahlen nicht. Bei Europcar fährt der Kunde, also fällt der größte Kostenblock dieses Falls weg. Die Logik von Fahrzeug-Tag, Standzeit, Haltedauer und Szenario bleibt.<\/p>'+\n    '<table class=\"tr\"><tr><th>In diesem Fall<\/th><th>Bei Europcar<\/th><th>Übertragbar<\/th><\/tr>'+\n    '<tr><td>Kosten je Fahrzeug und Monat, fix und variabel<\/td><td>Haltekosten und Betriebskosten je Fahrzeug und Monat<\/td><td><span class=\"pill p-d\">Direkt<\/span><\/td><\/tr>'+\n    '<tr><td>Standtag = Fixkosten ohne Umsatz<\/td><td>Standzeiten, Werkstatt, Transfers zwischen Stationen<\/td><td><span class=\"pill p-d\">Direkt<\/span><\/td><\/tr>'+\n    '<tr><td>Break-even Einsatztage<\/td><td>Break-even Auslastung je Segment, Station, Saison<\/td><td><span class=\"pill p-d\">Direkt<\/span><\/td><\/tr>'+\n    '<tr><td>Reparaturen steigen mit der Laufleistung<\/td><td>Haltedauer, Restwert, Zeitpunkt des Remarketings<\/td><td><span class=\"pill p-a\">Angepasst<\/span><\/td><\/tr>'+\n    '<tr><td>Ergebnisbrücke Basis → Szenario<\/td><td>Budget, Forecast und Plan/Ist mit Fleet Controlling<\/td><td><span class=\"pill p-d\">Direkt<\/span><\/td><\/tr>'+\n    '<tr><td>Fahrerkosten, Mindestlohn, Provision<\/td><td>entfällt: der Kunde fährt; dafür Preise und Vertriebskanäle<\/td><td><span class=\"pill p-n\">Nicht<\/span><\/td><\/tr><\/table>'+\n    '<p style=\"font-size:.82rem;color:var(--quiet);margin:12px 0 0\">Erst die bestehenden Modelle von Europcar verstehen, dann gemeinsam mit Fleet Controlling verbessern.<\/p><\/div>'}\n  left.innerHTML=h;\n  left.querySelectorAll('[data-v]').forEach(function(g){g.addEventListener('click',function(){selectV(+g.getAttribute('data-v'))})});\n  var bf=document.getElementById('backFleet');if(bf)bf.onclick=function(){selectV(null)};\n  if(step===4)wireScenario()}\n\nfunction wireScenario(){function sync(){document.getElementById('o_mw').textContent=num(P.mw,2)+' €';\n    document.getElementById('o_c').textContent=num(P.c,1)+' %';document.getElementById('o_up').textContent='+'+num(P.up,1)+' %';\n    document.getElementById('o_plus').textContent=P.plus?'+'+num(P.plus,1)+' Tage':'aus';\n    document.getElementById('o_repl').textContent=P.repl?num(P.repl)+' km':'nie';\n    document.getElementById('i_c').value=P.c;document.getElementById('i_up').value=P.up;document.getElementById('i_plus').value=P.plus;\n    document.querySelectorAll('#segmw button').forEach(function(b){b.classList.toggle('on',+b.dataset.mw===P.mw)});\n    document.querySelectorAll('#segrepl button').forEach(function(b){b.classList.toggle('on',+b.dataset.r===P.repl)})}\n  function upd(){sync();document.getElementById('bridge').innerHTML=chartBridge();kpis();colorFleet();if(sel!=null)showDetail()}\n  ['c','up','plus'].forEach(function(k){document.getElementById('i_'+k).oninput=function(e){P[k]=+e.target.value;upd()}});\n  document.querySelectorAll('#segmw button').forEach(function(b){b.onclick=function(){P.mw=+b.dataset.mw;upd()}});\n  document.querySelectorAll('#segrepl button').forEach(function(b){b.onclick=function(){P.repl=+b.dataset.r;upd()}});\n  document.querySelectorAll('[data-pre]').forEach(function(b){b.onclick=function(){var k=b.dataset.pre;\n    P=JSON.parse(JSON.stringify(BASE));if(k==='mw'||k==='counter')P.mw=14.6;if(k==='counter'){P.plus=2;P.repl=200000;P.up=2}upd()}});\n  sync()}\n\n/* ================= detail ================= */\nvar detail=document.getElementById('detail');\nfunction showDetail(){var h,tag='Fahrzeug-P&L',name,hero='';\n  if(sel==null){name='Auf ein Fahrzeug klicken';h='<p style=\"font-size:.86rem;color:var(--quiet);margin:0;max-width:80ch\">Jedes Feld im Raster ist ein Fahrzeug. Ein Klick zeigt seine P&amp;L pro Monat, die Kosten je Einsatztag und eine Diagnose: Liegt es an den Standtagen, an Reparaturen oder am Umsatz?<\/p>'}\n  else{var v=V[sel],p=step===4?P:BASE,r=calc(v,p),rows=[['Umsatz brutto',r.rev],['− Provision ('+num(p.c,1)+' %)',-r.comm],['− Fahrerkosten',-r.drv],['− Variable Fahrzeugkosten',-r.vr],['= Deckungsbeitrag',r.db,1],\n      ['− Fixkosten an Einsatztagen',-r.fixA],['− Fixkosten an Standtagen',-r.fixI],['− Reparaturen & Schäden',-r.rep],['= Ergebnis',r.res,1]];\n    if(step===4)tag='Fahrzeug-P&L · Szenario';name=v.id+' · '+v.age+' Monate · '+num(v.km)+' km';\n    hero='<span><b style=\"color:var(--'+(r.res<0?'leak':'flow')+')\">'+eur(r.res)+'<\/b>Ergebnis / Monat<\/span><span><b style=\"color:var(--ink)\">'+num(r.d,1)+'<\/b>Einsatztage<\/span>';\n    h='<div style=\"font-size:.82rem;color:var(--quiet)\">'+num(r.d,1)+' Einsatztage, '+num(r.idle,1)+' Standtage · Fahrzeugkosten je Einsatztag <b class=\"mono\" style=\"color:var(--ink)\">'+eur(r.perDay,2)+'<\/b>'+(r.newv?' · <b>im Szenario ersetzt<\/b>':'')+'<\/div>'+\n      '<div style=\"display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start\"><table class=\"pl\">'+rows.map(function(x){return'<tr class=\"'+(x[2]?'sub':'')+'\"><td>'+x[0]+'<\/td><td class=\"v '+(x[2]&&x[1]<0?'neg':'')+'\">'+eur(x[1])+'<\/td><\/tr>'}).join('')+'<\/table>';\n    var why=[];if(r.d<BE0)why.push(num(r.idle,1)+' Standtage: '+eur(r.fixI)+' Fixkosten ohne Umsatz'+(v.ws>1?' (davon rund '+num(v.ws,1)+' Werkstatttage)':''));\n    if(r.rep>200)why.push('Reparaturen & Schäden '+eur(r.rep)+' bei '+num(v.km)+' km: Ersatzzeitpunkt prüfen');\n    if(v.G<G0*0.99)why.push('Umsatz je Einsatztag unter Flottenschnitt: Schichtplanung prüfen');\n    h+=(r.res<0?'<div class=\"diag\"><b class=\"neg\">Diagnose · verliert Geld<\/b>'+(why.length?why.join('<br>'):'Knapp unter Break-even')+'<\/div>'\n             :'<div class=\"diag ok\"><b class=\"pos\">Diagnose · trägt sich<\/b>'+(why.length?'Beobachten: '+why.join('<br>'):'Hohe Auslastung, geringe Reparaturen.')+'<\/div>')+'<\/div>'}\n  document.getElementById('dTag').textContent=tag;document.getElementById('dName').textContent=name;document.getElementById('dHero').innerHTML=hero;\n  detail.innerHTML=h}\nvar drawer=document.getElementById('drawer'),dh=document.getElementById('dh');\nfunction setDrawer(o){if(o)setTimeout(function(){try{drawer.scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){}},40);drawer.classList.toggle('open',o);dh.setAttribute('aria-expanded',o);document.getElementById('dHint').textContent=o?'Ausblenden':'Details einblenden'}\ndh.onclick=function(){setDrawer(!drawer.classList.contains('open'))};\nfunction selectV(i){sel=i;colorFleet();showDetail();if(i!=null)setDrawer(true);if(step===2||step===3)renderLeft()}\n\n/* ================= navigation ================= */\nvar bar=document.getElementById('bar'),cues=document.getElementById('cues');\nfunction build(){bar.innerHTML='';STEPS.forEach(function(s,i){var b=document.createElement('button');b.innerHTML='<span class=\"no\">'+(i+1)+'<\/span>'+s.t.replace(/^\\d\\d · /,'');\n  if(i===step)b.className='on';b.onclick=function(){setStep(i)};bar.appendChild(b)});\n}\nwindow.__goto=function(i){setStep(i)};\nfunction setStep(i){step=Math.max(0,Math.min(STEPS.length-1,i));\n  document.getElementById('capT').textContent='Schritt '+(step+1)+' · '+STEPS[step].t;\n  document.getElementById('capH').textContent=STEPS[step].h;\n  document.getElementById('capN').textContent=(step+1)+' / '+STEPS.length;\n  build();renderLeft();kpis();colorFleet();showDetail()}\nfunction fs(){var st=document.getElementById('stage');if(!document.fullscreenElement&&st.requestFullscreen)st.requestFullscreen();else if(document.exitFullscreen)document.exitFullscreen()}\nvar IC={full:'<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10\"/><\/svg>',\n exit:'<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 2.5V6H2.5M13.5 6H10V2.5M10 13.5V10h3.5M2.5 10H6v3.5\"/><\/svg>'};\nvar fsB=document.getElementById('fsb');function updIcons(){var f=!!document.fullscreenElement;fsB.innerHTML=f?IC.exit:IC.full;fsB.title=f?'Vollbild beenden (F)':'Vollbild (F)'}\nfsB.onclick=fs;document.addEventListener('fullscreenchange',updIcons);updIcons();\ndocument.getElementById('prev').onclick=function(){setStep(step-1)};\ndocument.getElementById('next').onclick=function(){setStep(step+1)};\ndocument.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT')return;\n  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();setStep(step+1)}\n  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();setStep(step-1)}\n  else if(e.key==='f'||e.key==='F')fs();else if(e.key==='Escape'){if(drawer.classList.contains('open'))setDrawer(false);else selectV(null)}\n  else if(e.key==='i'||e.key==='I')setDrawer(!drawer.classList.contains('open'))});\nsetStep(0);\n})();\n<\/script>\n<\/body>\n<\/html>\n","<!DOCTYPE html>\n<html lang=\"de\" data-theme=\"light\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Mein Beitrag bei Europcar<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --bg:#fbfaf8;--panel:#ffffff;--ink:#1a1a1a;--quiet:#6b6b6b;--line:#e3e0da;--soft:#f3f1ec;\n  --flow:#13804f;--leak:#b8650f;--gate:#3f46b0;--gate-bg:#eef0fb;--dim:#b9b5ad;--teal:#4f8a8c;--ec:#1d4e89;--ec-bg:#e8eff7;\n}\n*,*::before,*::after{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}\n.wrap{max-width:1160px;margin:0 auto;padding:72px 16px 90px}\n.bar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:-1px;padding:0 14px;align-items:flex-end;position:relative;z-index:1}\n.bar button{padding:8px 16px;font:inherit;font-size:.79rem;font-weight:600;background:#f3f1ec;color:var(--quiet);border:1px solid var(--line);border-radius:10px 10px 0 0;cursor:pointer;transition:background .2s,color .2s}\n.bar button:hover{color:var(--ink);background:#ece9e3}\n.bar button.on{background:var(--panel);color:var(--ink);border-bottom-color:var(--panel);padding-top:10px}\n.bar button .no{font-family:\"JetBrains Mono\",monospace;font-size:.72rem;opacity:.6;margin-right:5px}\n#stage{background:var(--bg)}\n.caption{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);border-bottom:none;border-radius:14px 14px 0 0;background:var(--panel);padding:14px 18px 10px}\n.caption .ct{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--quiet)}\n.caption .ch{font-size:1.12rem;font-weight:700;margin:2px 0 0;letter-spacing:-.01em}\n.caption .nav{display:flex;gap:6px;align-items:center;flex:none}\n.caption .nav button{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}\n.caption .nav button:hover{border-color:var(--ink)}\n.caption .nav button svg{width:15px;height:15px;display:block}\n.caption .nav .sep{width:1px;height:20px;background:var(--line);margin:0 6px}\n.caption .nav span#capN{font-family:\"JetBrains Mono\",monospace;font-size:.8rem;color:var(--quiet);min-width:38px;text-align:center}\n.board{border:1px solid var(--line);border-radius:0 0 14px 14px;background:var(--panel);padding:22px 24px;min-height:500px;position:relative;overflow:hidden}\n#stage:fullscreen{padding:22px 28px;overflow:auto}\n.kick{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--quiet)}\n.lead{font-size:.95rem;color:var(--quiet);margin:4px 0 18px;max-width:72ch}\n.lead b{color:var(--ink)}\n.tag{display:inline-flex;align-items:center;gap:6px;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:999px}\n.tag.ec{background:var(--ec-bg);color:var(--ec)}\n.tag.me{background:var(--gate-bg);color:var(--gate)}\n.fade{animation:fade .55s cubic-bezier(.2,.7,.2,1) both}\n@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n.pop{animation:pop .45s cubic-bezier(.2,.7,.2,1) both}\n@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}\n@media (prefers-reduced-motion:reduce){.fade,.pop{animation:none}}\n.key{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0 0;font-size:.75rem;color:var(--quiet)}\n.key span{display:inline-flex;align-items:center;gap:6px}\n.drawer{margin:14px 0 0;border:1px solid var(--line);border-radius:14px;background:var(--
