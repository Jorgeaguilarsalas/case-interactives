<style>
:root{

}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto;padding:26px 16px 90px}
.vt{font-size:clamp(1.3rem,2.2vw,1.75rem);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 14px}
.bar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:-1px;padding:0 14px;align-items:flex-end;position:relative;z-index:1}
.bar button{padding:8px 16px;font:inherit;font-size:.79rem;font-weight:600;background:var(--soft);color:var(--quiet);border:1px solid var(--line);border-radius:10px 10px 0 0;cursor:pointer;transition:background .2s,color .2s}
.bar button:hover{color:var(--ink);background:#ece9e3}
.bar button.on{background:var(--panel);color:var(--ink);border-bottom-color:var(--panel);padding-top:10px}
.bar button .no{font-family:"JetBrains Mono",monospace;font-size:.7rem;opacity:.55;margin-right:6px}
.bar .sp{flex:1}
#stage{background:var(--bg)}
.frame{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.caption{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.caption .ct{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--quiet)}
.caption .ch{font-size:1.12rem;font-weight:700;margin:2px 0 0;letter-spacing:-.01em}
.caption .nav{display:flex;gap:6px;align-items:center;flex:none}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
canvas{display:block;min-width:920px;width:100%;height:auto}
#stage:fullscreen{padding:24px 30px;display:flex;flex-direction:column;justify-content:center}
#stage:fullscreen .scroll{overflow:hidden}
#stage:fullscreen canvas{min-width:0;width:auto;max-width:100%;max-height:calc(100vh - 150px);margin:0 auto}
.detail{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px}
.dhead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap}
.kick{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--quiet)}
.detail h3{margin:4px 0 2px;font-size:1.25rem;letter-spacing:-.015em}
.meta{font-size:.84rem;color:var(--quiet)}
.hero{display:flex;gap:22px;flex-wrap:wrap}
.hero div{text-align:right}
.hero b{display:block;font-family:"JetBrains Mono",monospace;font-size:1.45rem;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:var(--flow)}
.hero span{font-size:.72rem;color:var(--quiet)}
.grid3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px;margin-top:16px}
@media (max-width:860px){.grid3{grid-template-columns:1fr !important}.hero div{text-align:left}}
.cell{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:.86rem}
.cell .h{display:block;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--quiet);margin-bottom:6px}
.cell ul{margin:0;padding-left:16px}.cell li{margin-bottom:3px}
.cell.ev .h{color:var(--flow)}.cell.ec .h{color:var(--p)}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:760px){.tri{grid-template-columns:1fr}}
.tri .cell b.t{display:block;font-size:.9rem;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:.76rem;font-weight:600;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-family:inherit}
.chip:hover{border-color:var(--quiet)}
.sw{width:9px;height:9px;border-radius:3px;display:inline-block}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tags span{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

.dhead .dr{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);white-space:nowrap}
.dhead:hover .tog{border-color:var(--quiet)}
.tog svg{transition:transform .3s ease}
.detail.open .tog svg{transform:rotate(180deg)}
.dbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.detail.open .dbody{grid-template-rows:1fr}
.dbody>div{overflow:hidden;min-height:0}
.detail{padding:16px 22px}
.detail h3{font-size:1.1rem}
@media (prefers-reduced-motion:reduce){.dbody,.tog svg{transition:none}}

.caption .nav button{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.caption .nav button:hover{border-color:var(--ink)}
.caption .nav button svg{width:15px;height:15px;display:block}
.caption .nav .sep{width:1px;height:20px;background:var(--line);margin:0 6px;min-width:0}
.caption .nav span#capN{font-family:"JetBrains Mono",monospace;font-size:.8rem;color:var(--quiet);min-width:38px;text-align:center}
.drawer{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(1128px,calc(100vw - 32px));z-index:20;
  background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.10)}
.dh{width:100%;display:flex;align-items:center;gap:12px;padding:10px 18px;background:transparent;border:0;color:var(--ink);font:inherit;cursor:pointer;text-align:left;border-radius:14px 14px 0 0}
.dh:hover .dchev{border-color:var(--ink)}
.dh .dt{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--quiet);border:1px solid var(--line);border-radius:5px;padding:2px 7px;white-space:nowrap}
.dh .dn{font-size:.86rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh .dhero{display:flex;gap:16px;margin-left:auto;white-space:nowrap}
.dh .dhero span{font-size:.7rem;color:var(--quiet)}
.dh .dhero b{font-family:"JetBrains Mono",monospace;font-size:.86rem;color:var(--flow);margin-right:5px}
.dh .dhint{font-size:.74rem;color:var(--quiet);white-space:nowrap}
.dh .dhero:empty+.dhint{margin-left:auto}
.dh .dchev{flex:none;width:28px;height:28px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.dh .dchev svg{width:14px;height:14px;transition:transform .2s}
.drawer.open .dchev svg{transform:rotate(180deg)}
#detail{display:none;padding:2px 18px 18px;max-height:46vh;overflow-y:auto;border-top:1px solid var(--line)}
.drawer.open #detail{display:block;padding-top:14px}
@media (max-width:760px){.dh .dhint,.dh .dhero{display:none}}
.key{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0 16px;font-size:.75rem;color:var(--quiet)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key .sw{width:11px;height:11px;border-radius:3px;flex:none;display:inline-block}
/* Detailbereich öffnet nach unten (im Seitenfluss statt fixiert) */
.drawer{position:static;left:auto;bottom:auto;transform:none;width:auto;margin:14px 0 0;border:1px solid var(--line);border-radius:14px;box-shadow:none;z-index:auto}
.dh{border-radius:14px}
.drawer.open .dh{border-radius:14px 14px 0 0}
#detail{max-height:none;overflow:visible}
.dh .dchev svg{transform:rotate(180deg)}
.drawer.open .dchev svg{transform:none}
</style>
</head>
