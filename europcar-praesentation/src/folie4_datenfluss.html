<!DOCTYPE html>
<html lang="de" class="pnew" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Folie 4 · Nexio Datenfluss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfaf8;--panel:#fff;--ink:#1a1a1a;--quiet:#6b6b6b;--line:#e3e0da;
  --flow:#3a7d5d;--leak:#b45309;--gate:#8b2d6b;--gate-bg:#f7eaf2;--dim:#b9b5ad;
  --s1:#2f6db5;--s2:#0f8a8a;--s3:#7656c9;--s4:#a87a10;--s5:#c2417a;
  --ec:#1d4e89;--ec-bg:#e8eff7;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161614;--panel:#1f1f1d;--ink:#f0eee9;--quiet:#a5a39d;--line:#33332f;
  --flow:#6ab98c;--leak:#e0a060;--gate:#d98cc0;--gate-bg:#2b1c26;--dim:#4a4a45;
  --s1:#7eb0e8;--s2:#5cc4c4;--s3:#a993ec;--s4:#d9b45a;--s5:#e88ab0;
  --ec:#7eb0e8;--ec-bg:#1a2432;
}}
:root[data-theme="dark"]{
  --bg:#161614;--panel:#1f1f1d;--ink:#f0eee9;--quiet:#a5a39d;--line:#33332f;
  --flow:#6ab98c;--leak:#e0a060;--gate:#d98cc0;--gate-bg:#2b1c26;--dim:#4a4a45;
  --s1:#7eb0e8;--s2:#5cc4c4;--s3:#a993ec;--s4:#d9b45a;--s5:#e88ab0;
  --ec:#7eb0e8;--ec-bg:#1a2432;
}
/* ---- Neue Palette: gedämpfte Quellen, klares Grün, Indigo für „Mein Beitrag“ ---- */
:root.pnew{
  --s1:#5d7899;--s2:#4f8a8c;--s3:#7f7aa8;--s4:#a08a5a;--s5:#a07068;
  --flow:#13804f;--leak:#b8650f;--gate:#3f46b0;--gate-bg:#eef0fb;
}
@media (prefers-color-scheme:dark){:root.pnew:not([data-theme="light"]){
  --s1:#8ea4c2;--s2:#7fb0b2;--s3:#a9a4cc;--s4:#c4b083;--s5:#c49a92;
  --flow:#46b884;--leak:#e09a4c;--gate:#959df0;--gate-bg:#1d2033;
}}
:root.pnew[data-theme="dark"]{
  --s1:#8ea4c2;--s2:#7fb0b2;--s3:#a9a4cc;--s4:#c4b083;--s5:#c49a92;
  --flow:#46b884;--leak:#e09a4c;--gate:#959df0;--gate-bg:#1d2033;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:1160px;margin:0 auto;padding:26px 16px 80px}
.tag{display:inline-block;font-size:.65rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;padding:3px 8px;border-radius:5px;border:1px solid var(--line);
  color:var(--quiet);margin-bottom:9px}
h1{font-size:1.45rem;font-weight:700;margin:0 0 6px;letter-spacing:-.015em}
.sub{color:var(--quiet);font-size:.9rem;margin:0 0 16px;max-width:72ch}
.bar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:-1px;padding:0 14px;align-items:flex-end;position:relative;z-index:1}
.bar button{padding:8px 16px;font:inherit;font-size:.79rem;font-weight:600;background:#f3f1ec;color:var(--quiet);border:1px solid var(--line);border-radius:10px 10px 0 0;cursor:pointer;transition:background .2s,color .2s}
.bar button:hover{color:var(--ink);background:#ece9e3}
.bar button.on{background:var(--panel);color:var(--ink);border-bottom-color:var(--panel);padding-top:10px}
.bar button .no{font-family:"JetBrains Mono",monospace;font-size:.72rem;opacity:.6;margin-right:5px}
.bar .sp{flex:1}
#stage{background:var(--bg)}
.caption{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;
  border:1px solid var(--line);border-bottom:none;border-radius:14px 14px 0 0;background:var(--panel);
  padding:14px 18px 10px}
.caption .ct{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--quiet)}
.caption .ch{font-size:1.12rem;font-weight:700;margin:2px 0 0;letter-spacing:-.01em}
.caption .nav{display:flex;gap:6px;align-items:center;flex:none}
.caption .nav button{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--ink);font:inherit;font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.caption .nav button:hover{border-color:var(--ink)}
.caption .nav button svg{width:15px;height:15px;display:block}
.caption .nav .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.caption .nav .seg button{width:auto;height:28px;padding:0 11px;border:none;font-size:.76rem;font-weight:600;color:var(--quiet)}
.caption .nav .seg button:hover{color:var(--ink)}
.caption .nav .seg button.on{background:var(--ink);color:var(--bg)}
.caption .nav .seg button.on.ec{background:var(--ec);color:var(--panel)}
@media (max-width:720px){.caption{flex-wrap:wrap}.caption .nav{flex-wrap:wrap}}
.caption .nav .sep{width:1px;height:20px;background:var(--line);margin:0 6px;min-width:0}
.caption .nav span#capN{font-family:"JetBrains Mono",monospace;font-size:.8rem;color:var(--quiet);min-width:38px;text-align:center}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
  border-radius:0 0 14px 14px;background:var(--panel)}
canvas{display:block;min-width:900px;width:100%;height:auto;cursor:default}
#stage:fullscreen{padding:22px 28px;display:flex;flex-direction:column;justify-content:center}
#stage:fullscreen .scroll{overflow:hidden}
#stage:fullscreen canvas{min-width:0;width:auto;max-width:100%;max-height:calc(100vh - 170px);margin:0 auto}
#stage:fullscreen .key{justify-content:center}
.drawer{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(1128px,calc(100vw - 32px));z-index:20;
  background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.10)}
.dh{width:100%;display:flex;align-items:center;gap:12px;padding:10px 18px;background:transparent;border:0;color:var(--ink);
  font:inherit;cursor:pointer;text-align:left;border-radius:14px 14px 0 0}
.dh:hover .dchev{border-color:var(--ink)}
.dh .dt{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--quiet);
  border:1px solid var(--line);border-radius:5px;padding:2px 7px;white-space:nowrap}
.dh .dn{font-size:.86rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh .dhint{margin-left:auto;font-size:.74rem;color:var(--quiet);white-space:nowrap}
.dh .dchev{flex:none;width:28px;height:28px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.dh .dchev svg{width:14px;height:14px;transition:transform .2s}
.drawer.open .dchev svg{transform:rotate(180deg)}
#detail{display:none;padding:2px 18px 18px;max-height:42vh;overflow-y:auto;border-top:1px solid var(--line)}
.drawer.open #detail{display:block;padding-top:14px}
#detail>.tag,#detail>h3{display:none}
#detail>p,#detail dl,#detail .check,#detail .ex{max-width:80ch}
@media (max-width:600px){.dh .dhint{display:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{margin:0 0 5px;font-size:1.05rem}
.card>p{margin:0 0 10px;font-size:.87rem;color:var(--quiet)}
dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.85rem}
dt{color:var(--quiet);font-weight:500;white-space:nowrap}
dd{margin:0}
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;
  border:1px solid var(--line);margin:0 4px 4px 0;cursor:pointer;background:transparent;color:var(--ink);font-family:inherit}
.chip:hover{border-color:var(--ink)}
.check{margin-top:12px;padding:10px 12px;border-radius:10px;border-left:3px solid var(--leak);background:var(--bg);font-size:.84rem}
.check b{color:var(--leak);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:2px}
.ex{margin-top:10px;padding:10px 12px;border-radius:10px;border-left:3px solid var(--flow);background:var(--bg);font-size:.84rem}
.ex b{color:var(--flow);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:2px}
ol.cues{margin:0;padding:0;list-style:none;counter-reset:c}
ol.cues li{counter-increment:c;padding:8px 10px 8px 38px;position:relative;border-radius:9px;cursor:pointer;
  font-size:.84rem;border:1px solid transparent}
ol.cues li::before{content:counter(c,decimal-leading-zero);position:absolute;left:10px;top:9px;
  font-family:"JetBrains Mono",monospace;font-size:.72rem;color:var(--quiet)}
ol.cues li b{display:block;font-size:.8rem}
ol.cues li span{color:var(--quiet)}
ol.cues li:hover{background:var(--bg)}
ol.cues li.on{border-color:var(--ink);background:var(--bg)}
ol.cues li.on span{color:var(--ink)}
.key{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0 16px;font-size:.75rem;color:var(--quiet)}
.key span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;flex:none;display:inline-block}
kbd{font-family:"JetBrains Mono",monospace;font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (max-width:600px){h1{font-size:1.2rem}.caption .ch{font-size:1rem}}
/* Detailbereich öffnet nach unten (im Seitenfluss statt fixiert) */
.drawer{position:static;left:auto;bottom:auto;transform:none;width:auto;margin:14px 0 0;border:1px solid var(--line);border-radius:14px;box-shadow:none;z-index:auto}
.dh{border-radius:14px}
.drawer.open .dh{border-radius:14px 14px 0 0}
#detail{max-height:none;overflow:visible}
.dh .dchev svg{transform:rotate(180deg)}
.drawer.open .dchev svg{transform:none}
.ecnote{display:none;align-items:center;gap:7px;font-size:.74rem;font-weight:700;color:var(--ec,#1d4e89);background:#e8eff7;border:1px dashed #9db4d3;padding:4px 11px;border-radius:999px}
body.ecmode .ecnote{display:inline-flex}
</style>
</head>

</div>

</div>

  /* Schritt „Mein Beitrag“: Animation automatisch anhalten, beim Verlassen wieder starten */
  if(step===5){if(!paused){paused=true;autoPaused=true}}else if(autoPaused){paused=false;autoPaused=false}
  if(typeof updIcons==='function')updIcons();
  if(step===1)initSilo();
  /* prefill so a step never starts empty */
  if(step!==1&&!reduce){for(var j=0;j<300;j++)update(.05)}
  document.getElementById('capT').textContent='Schritt '+(step+1)+' · '+STEPS[step].t;
  document.getElementById('capH').textContent=mode==='europcar'?STEPS[step].hEc:STEPS[step].h;
  document.getElementById('capN').textContent=(step+1)+' / '+STEPS.length;
  buildBar();buildCues();
  if(!sel){var auto={1:'S1',2:'INT',3:'STR',4:'K1',5:'ROLE',6:'D1'}[step];showDetail(auto||null,true)}}
window.__goto=function(i){if(typeof started!=="undefined"&&!started){window.__initStep=i;return}setStep(i)};
function toggleMode(){mode=mode==='nexio'?'europcar':'nexio';M=MODES[mode];document.body.classList.toggle('ecmode',mode==='europcar');
  sel=null;setStep(step);showDetail(null)}
function togglePause(){paused=!paused;autoPaused=false;updIcons()}
function fs(){var st=document.getElementById('stage');if(!document.fullscreenElement&&st.requestFullscreen)st.requestFullscreen();else if(document.exitFullscreen)document.exitFullscreen()}

var detail=document.getElementById('detail');
function feeds(list,pre,names){return list.map(function(i){return'<button class="chip" data-id="'+pre+i+'">'+names[i].n+'</button>'}).join('')}
function showDetail(id,auto){if(!auto)sel=id;var h='';
  if(!id){h='<span class="tag">Start hier</span><h3>Auf ein Feld klicken</h3><p>Jedes Feld zeigt, was dort passiert, ein typisches Beispiel und was es speist. Die Verbindungen leuchten auf, der Rest wird ausgeblendet.</p>'}
  else{var sp=/^(INT|STR|BASE|TRAY|ROLE)$/.test(id),t=sp?'':id[0],n=+id.slice(1);
   if(t==='S'){var s=M.src[n];var ks=M.SK[n],ds={};ks.forEach(function(k){M.KD[k].forEach(function(d){ds[d]=1})});
     h='<span class="tag">Datenquelle</span><h3>'+s.n+'</h3><p>'+s.body+'</p><dl><dt>Speist KPIs</dt><dd>'+feeds(ks,'K',M.kpi)+'</dd><dt>Unterstützt</dt><dd>'+feeds(Object.keys(ds).map(Number),'D',M.dec)+'</dd></dl><div class="check"><b>Typischer Prüffall</b>'+s.chk+'</div>'}
   else if(t==='K'){var kk=M.kpi[n];var srcs=[];M.SK.forEach(function(ks,s){if(ks.indexOf(n)>=0)srcs.push(s)});
     h='<span class="tag">Analytik &amp; KPIs</span><h3>'+kk.n+'</h3><p>'+kk.body+'</p><dl><dt>Braucht Daten aus</dt><dd>'+feeds(srcs,'S',M.src)+'</dd><dt>Unterstützt</dt><dd>'+feeds(M.KD[n],'D',M.dec)+'</dd></dl><div class="ex"><b>Beispiel-Definition</b>'+kk.ex+'</div>'}
   else if(t==='D'){var dd=M.dec[n];var kp=[],sr={};M.KD.forEach(function(ds,k){if(ds.indexOf(n)>=0){kp.push(k);M.SK.forEach(function(ks,s){if(ks.indexOf(k)>=0)sr[s]=1})}});
     h='<span class="tag">Entscheidung 0'+(n+1)+'</span><h3>'+dd.n+'</h3><p>'+dd.body+'</p><dl><dt>Gestützt auf</dt><dd>'+feeds(kp,'K',M.kpi)+'</dd><dt>Quellen</dt><dd>'+feeds(Object.keys(sr).map(Number),'S',M.src)+'</dd></dl><p style="margin:12px 0 0;font-size:.82rem;color:var(--quiet)">Keine dieser Fragen lässt sich aus einer einzigen Quelle beantworten. Deshalb steht die Integration am Anfang.</p>'}
   else if(id==='INT')h='<span class="tag">Schritt 1 der Plattform</span><h3>'+M.int.n+'</h3><p>'+M.int.body+'</p><dl><dt>Wege</dt><dd>'+M.int.s+'</dd></dl>';
   else if(id==='STR')h='<span class="tag">Schritt 2 der Plattform</span><h3>'+M.str.n+'</h3><p>'+M.str.body+'</p><div class="check"><b>Markierte Prüffälle</b>Auffällige Datensätze landen nicht im KPI, sondern werden zur Klärung markiert. Ein Klick auf eine Datenquelle zeigt ein typisches Beispiel.</div>';
   else if(id==='BASE')h='<span class="tag">Ergebnis</span><h3>'+M.base.n+'</h3><p>'+M.base.body+'</p>';
   else if(id==='TRAY')h='<span class="tag">Datenqualität</span><h3>Markierte Prüffälle</h3><p>Datensätze, die eine Prüfregel verletzen, werden markiert und geklärt, statt still in die Kennzahlen einzufließen. Die Menge in der Animation ist illustrativ.</p>';
   else if(id==='ROLE')h='<span class="tag">Mein Beitrag</span><h3>Strategy &amp; Operations</h3><p>'+M.roleBody+'</p><dl><dt>Schritte</dt><dd>'+M.role.join(' → ')+'</dd><dt>Berührt</dt><dd>Integration (welche Daten), Prüfung (welche Regeln), KPIs (welche Definitionen)</dd></dl>';
  }
  if(!detail)return;detail.innerHTML=h;
  var tg=detail.querySelector('.tag'),h3=detail.querySelector('h3');
  document.getElementById('dTag').textContent=tg?tg.textContent:'Details';document.getElementById('dName').textContent=h3?h3.textContent:'';
  detail.querySelectorAll('.chip').forEach(function(b){b.onclick=function(){showDetail(b.getAttribute('data-id'))}})}

cv.addEventListener('click',function(e){var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  var hit=null;HIT.forEach(function(b){if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)hit=b.id});
  if(hit===sel||!hit)showDetail(null);else showDetail(hit)});
cv.addEventListener('mousemove',function(e){var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  cv.style.cursor=HIT.some(function(b){return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h})?'pointer':'default'});
document.getElementById('prev').onclick=function(){setStep(step-1)};
document.getElementById('next').onclick=function(){setStep(step+1)};
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();setStep(step+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();setStep(step-1)}
  else if(e.key==='f'||e.key==='F')fs();else if(e.key==='e'||e.key==='E')toggleMode();
  else if(e.key==='p'||e.key==='P')togglePause();else if(e.key==='Escape'){if(drawer.classList.contains('open'))setDrawer(false);else showDetail(null)}
  else if(e.key==='i'||e.key==='I')setDrawer(!drawer.classList.contains('open'))});
var drawer=document.getElementById('drawer'),dh=document.getElementById('dh');
function setDrawer(o){if(o)setTimeout(function(){try{drawer.scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){}},40);drawer.classList.toggle('open',o);dh.setAttribute('aria-expanded',o);document.getElementById('dHint').textContent=o?'Ausblenden':'Details einblenden'}
dh.onclick=function(){setDrawer(!drawer.classList.contains('open'))};

var started=false;function start(){started=true;var s0=window.__initStep||0;setStep(s0);if(!s0)showDetail(null);requestAnimationFrame(loop)}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(start);else start();
})();
</script>
</body>
</html>
