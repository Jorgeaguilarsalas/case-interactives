<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>People Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/*BASE_CSS*/
.pm{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:860px){.pm{grid-template-columns:1fr}}
.org{position:relative;height:330px}
.org svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;translate:-50% -50%;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem;border:2px solid var(--line);background:var(--panel)}
.av.me{width:84px;height:84px;background:var(--gate);color:#fff;border-color:var(--gate);font-size:1.05rem;box-shadow:0 0 0 8px var(--gate-bg)}
.node small{font-size:.72rem;color:var(--quiet);font-weight:600;line-height:1.25}
.resp{display:flex;flex-direction:column;gap:9px}
.resp .r{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.resp .r i{flex:none;width:30px;height:30px;border-radius:9px;background:var(--gate-bg);color:var(--gate);display:grid;place-items:center;font-style:normal;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:.78rem}
.resp .r b{font-size:.92rem}
.learn{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.84rem;color:var(--quiet)}
.learn span.p{font-weight:700;color:var(--ink);padding:6px 12px;border-radius:999px;background:var(--soft)}
.oneone{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:6px 0 20px}
@media (max-width:860px){.oneone{grid-template-columns:1fr 1fr}}
.oneone div{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);position:relative}
.oneone div .n{font-family:"JetBrains Mono",monospace;font-size:.7rem;color:var(--gate);font-weight:700}
.oneone div b{display:block;font-size:.88rem;margin:3px 0 4px}
.oneone div q{font-size:.78rem;color:var(--quiet);quotes:"„" "“"}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:860px){.modes{grid-template-columns:1fr 1fr}}
.mode{border-radius:12px;padding:14px;background:var(--soft)}
.mode.def{background:var(--gate-bg);outline:1.5px solid var(--gate)}
.mode b{display:block;font-size:.95rem}
.mode span{font-size:.7rem;font-weight:700;color:var(--gate);text-transform:uppercase;letter-spacing:.06em}
.mode q{display:block;margin-top:6px;font-size:.82rem;color:var(--quiet);quotes:"„" "“"}
.principle{margin-top:18px;padding:12px 16px;border-left:3px solid var(--gate);background:var(--gate-bg);border-radius:0 12px 12px 0;font-size:.92rem}
.road{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;position:relative;margin:8px 0 22px}
@media (max-width:860px){.road{grid-template-columns:1fr}}
.ph{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--panel);position:relative}
.ph .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--gate);color:#fff;font-weight:800;font-size:.85rem;margin-bottom:8px}
.ph b{display:block;font-size:.98rem;margin-bottom:4px}
.ph p{margin:0;font-size:.82rem;color:var(--quiet)}
.ph:not(:last-child)::after{content:"";position:absolute;right:-12px;top:30px;width:12px;height:2px;background:var(--gate)}
@media (max-width:860px){.ph:not(:last-child)::after{display:none}}
.goal{display:flex;gap:18px;align-items:center;padding:16px 18px;border-radius:14px;background:var(--soft);flex-wrap:wrap}
.five{display:flex;gap:6px}
.five i{width:34px;height:34px;border-radius:50%;background:var(--panel);border:2px solid var(--gate);display:block}
.goal p{margin:0;flex:1;min-width:240px;font-size:.95rem}
.goal p b{color:var(--gate)}
</style>
</head>
<body>
<div class="wrap">
<div class="bar" id="bar"></div>
<div id="stage">
  <div class="caption">
    <div><div class="ct" id="capT"></div><div class="ch" id="capH"></div></div>
    <div class="nav"><button id="prev" aria-label="Zurück">&larr;</button><span id="capN"></span><button id="next" aria-label="Weiter">&rarr;</button><i class="sep" aria-hidden="true"></i><button id="fsb" aria-label="Vollbild"></button></div>
  </div>
  <div class="board" id="board"></div>
  <div class="drawer" id="drawer">
    <button class="dh" id="dh" aria-expanded="false" aria-controls="detail"><span class="dt" id="dTag">Details</span><span class="dn" id="dName"></span><span class="dhint" id="dHint">Details einblenden</span><span class="dchev"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"/></svg></span></button>
    <div id="detail" aria-live="polite"></div>
  </div>
</div>
</div>
<script>
window.VIEW={steps:[
 {t:'Erfahrung bei Bliq',h:'Vier direkte Mitarbeitende: klare Ziele, KPIs und regelmäßiges Feedback.',
  render:function(el){
   var R=['Aufgaben und Projekte verteilt','KPIs verfolgt','Regelmäßige Einzelgespräche geführt','Coaching angeboten','Bei Leistungsbeurteilungen mitgewirkt'];
   el.innerHTML='<div class="kick">People Management · Bliq · Supply Operations · Jul 2024 – Jul 2025</div>'+
   '<p class="lead">Bei Bliq haben <b>vier Mitarbeitende direkt an mich berichtet</b>.</p>'+
   '<div class="pm"><div class="org" id="org"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><g stroke="#cfcbe9" stroke-width="2" fill="none" stroke-dasharray="4 5" vector-effect="non-scaling-stroke"><line x1="50" y1="53" x2="18" y2="66" vector-effect="non-scaling-stroke"/><line x1="50" y1="53" x2="39" y2="72" vector-effect="non-scaling-stroke"/><line x1="50" y1="53" x2="61" y2="72" vector-effect="non-scaling-stroke"/><line x1="50" y1="53" x2="82" y2="66" vector-effect="non-scaling-stroke"/></g></svg>'+
   '<div class="node pop" style="left:50%;top:32%"><div class="av me">JA</div><small>Supply Operations<br>Manager</small></div>'+
   [['18%','76%'],['39%','82%'],['61%','82%'],['82%','76%']].map(function(p,i){return'<div class="node pop" style="left:'+p[0]+';top:'+p[1]+';animation-delay:'+(.15+i*.1)+'s"><div class="av">'+(i+1)+'</div><small>Mitarbeitende</small></div>'}).join('')+
   '</div><div><div class="resp">'+R.map(function(r,i){return'<div class="r fade" style="animation-delay:'+(.2+i*.12)+'s"><i>0'+(i+1)+'</i><b>'+r+'</b></div>'}).join('')+'</div>'+
   '<div class="learn fade" style="animation-delay:.9s">Gelernt: <span class="p">Klare Ziele</span><span class="p">Eigenverantwortung</span><span class="p">Regelmäßiges Feedback</span></div></div></div>'},
  detail:{tag:'Bliq',name:'Supply Operations Manager · Jul 2024 – Jul 2025',
   html:'<div class="cols"><div class="cell"><b class="h">Verantwortung</b><ul><li>Vier direkte Mitarbeitende</li><li>Aufgaben und Projekte verteilt, KPIs verfolgt</li><li>Regelmäßige Einzelgespräche und Coaching</li><li>Mitwirkung an Leistungsbeurteilungen</li><li>Außerdem: Supply-Budgets, KPIs und Partnerprogramme</li></ul></div>'+
   '<div class="cell"><b class="h">Sprechtext (DE-v1.3)</b>Bei Bliq haben vier Mitarbeitende direkt an mich berichtet. Ich habe Aufgaben und Projekte verteilt, KPIs verfolgt, regelmäßige Einzelgespräche geführt, Coaching angeboten und bei Leistungsbeurteilungen mitgewirkt. Dabei habe ich gelernt, wie wichtig klare Ziele, Eigenverantwortung und regelmäßiges Feedback sind.</div></div>'}},
 {t:'Meine Arbeitsweise',h:'Ein 1:1 ist kein Status-Meeting: Ziel sind Urteilsvermögen und Eigenständigkeit.',
  render:function(el){
   var P=[['Ankommen','Wie geht es dir wirklich?'],['Deine Themen zuerst','Was beschäftigt dich diese Woche am meisten?'],['Meine Punkte','Feedback, Entscheidungen, Kontext'],['Nach vorne','Zusagen und Entwicklung'],['Abschluss','Was bringst du beim nächsten Mal mit?']];
   var M=[['Orientierung','Ist klar, wie ein gutes Ergebnis aussieht?',0],['Unterstützung','Was steht dir im Weg?',1],['Verbindlichkeit','Wir hatten X bis Y vereinbart – wo stehen wir?',0],['Entwicklung','Welche Entscheidung möchtest du im nächsten Quartal selbst verantworten?',0]];
   el.innerHTML='<div class="kick">Meine Praxis · Einzelgespräche</div><p class="lead">Aufbau eines 1:1 in fünf Teilen, wöchentlich 30 Minuten mit direkten Mitarbeitenden.</p>'+
   '<div class="oneone">'+P.map(function(p,i){return'<div class="fade" style="animation-delay:'+(i*.08)+'s"><span class="n">0'+(i+1)+'</span><b>'+p[0]+'</b><q>'+p[1]+'</q></div>'}).join('')+'</div>'+
   '<div class="kick" style="margin-bottom:8px">Vier Modi, je nach Person und Situation</div><div class="modes">'+M.map(function(m,i){return'<div class="mode fade'+(m[2]?' def':'')+'" style="animation-delay:'+(.4+i*.08)+'s">'+(m[2]?'<span>Standard</span>':'<span>&nbsp;</span>')+'<b>'+m[0]+'</b><q>'+m[1]+'</q></div>'}).join('')+'</div>'+
   '<div class="principle fade" style="animation-delay:.8s">„Ein 1:1 ist kein Status-Meeting – den Status sehe ich im Dashboard.“</div>'},
  detail:{tag:'Meine Praxis',name:'Rhythmus und Regeln',
   html:'<div class="cols"><div class="cell"><b class="h">Rhythmus</b><ul><li>Wöchentlich 30 Min. mit direkten Mitarbeitenden</li><li>Alle zwei Wochen 45 Min. mit erfahrenen Mitarbeitenden</li><li>Monatlich 60 Min. für Entwicklung, getrennt vom operativen Gespräch</li></ul></div>'+
   '<div class="cell"><b class="h">Regeln</b><ul><li>Keine Aufgabenkontrolle im 1:1 (dafür Stand-up oder asynchron)</li><li>Keine Überraschungen in Leistungsbeurteilungen</li><li>1:1s werden nicht abgesagt</li><li>Bei Problemen zuerst klären: Können, Wollen oder System?</li></ul></div>'+
   '<div class="cell"><b class="h">Coaching</b>Verstehen → Fragen → Herausfordern → Vereinbaren → Überprüfen. Maßstab: Trifft die Person nach sechs Monaten mehr Entscheidungen selbst?</div></div>'}},
 {t:'Ansatz bei Europcar',h:'Auf vorhandenem Wissen aufbauen und ein selbstständiges Team entwickeln.',
  render:function(el){
   var S=[['Kennenlernen','Die fünf Spezialisten: ihre Kompetenzen, ihre Aufgaben und die Zusammenarbeit mit anderen Bereichen.'],['Standards stärken','Gemeinsame Standards für Daten, Definitionen und Abläufe.'],['Entwicklung','Coaching und Cross-Training, damit Wissen nicht an einer Person hängt.'],['Klare Verantwortung','Klare Verantwortlichkeiten je Thema und Bereich.']];
   el.innerHTML='<div class="kick">Mein Ansatz · Team von fünf Spezialisten</div><p class="lead">Bei Europcar würde ich <b>zuerst zuhören und verstehen</b>, dann gemeinsam Standards und Entwicklung stärken.</p>'+
   '<div class="road">'+S.map(function(s,i){return'<div class="ph fade" style="animation-delay:'+(i*.14)+'s"><span class="n">'+(i+1)+'</span><b>'+s[0]+'</b><p>'+s[1]+'</p></div>'}).join('')+'</div>'+
   '<div class="goal fade" style="animation-delay:.65s"><div class="five" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><p><b>Ziel:</b> ein selbstständiges, gut zusammenarbeitendes Team, das zuverlässige Analysen für wichtige Geschäftsentscheidungen liefert.</p></div>'},
  detail:{tag:'Sprechtext',name:'DE-v1.3 · People Management',
   html:'<p style="margin:0;max-width:85ch">Bei Europcar würde ich zuerst die fünf Spezialisten kennenlernen: ihre Kompetenzen, ihre Aufgaben und die Zusammenarbeit mit anderen Bereichen. Danach würde ich gemeinsame Standards stärken, die Entwicklung durch Coaching und Cross-Training unterstützen und für klare Verantwortlichkeiten sorgen. Mein Ziel wäre es, auf dem vorhandenen Wissen aufzubauen und ein selbstständiges, gut zusammenarbeitendes Team zu entwickeln, das zuverlässige Analysen für wichtige Geschäftsentscheidungen liefert.</p>'}}
]};
</script>
<script>/*ENGINE_JS*/</script>
</body>
</html>
