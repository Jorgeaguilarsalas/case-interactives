<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Europcar · Interaktive Präsentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfaf8;--panel:#ffffff;--ink:#1a1a1a;--quiet:#6b6b6b;--line:#e3e0da;--soft:#f3f1ec;
  --flow:#13804f;--leak:#b8650f;--gate:#3f46b0;--gate-bg:#eef0fb;--dim:#b9b5ad;
  --s1:#5d7899;--s2:#4f8a8c;--s3:#7f7aa8;--s4:#a08a5a;--s5:#a07068;
  --top:56px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
/* ---------- top bar ---------- */
.top{position:fixed;inset:0 0 auto 0;height:var(--top);z-index:50;display:flex;align-items:center;gap:16px;padding:0 18px;
  background:rgba(251,250,248,.92);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left}
.mono{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--panel);display:grid;place-items:center;font-weight:800;font-size:.78rem;letter-spacing:.02em;flex:none}
.brand .mono{display:grid}
.brand b{display:block;font-size:.84rem;line-height:1.2}
.brand span{display:block;font-size:.7rem;color:var(--quiet);line-height:1.2;white-space:nowrap}
.tabs{display:flex;gap:4px;margin:0 auto;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.tabs button{font:inherit;font-size:.78rem;font-weight:600;color:var(--quiet);background:transparent;border:0;border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--ink);color:var(--panel)}
.tabs .n{font-family:"JetBrains Mono",monospace;font-size:.68rem;opacity:.6}
.tbtn{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.tbtn:hover{border-color:var(--ink)}
.tbtn svg{width:15px;height:15px}
@media (max-width:980px){.brand span{display:none}}
@media (max-width:820px){.tabs .t{display:none}.brand b{display:none}}
/* ---------- views ---------- */
.view{position:fixed;inset:var(--top) 0 0 0;display:none}
.view.on{display:block}
.view iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
#welcome{overflow-y:auto}
/* ---------- welcome ---------- */
.hero{max-width:1120px;margin:0 auto;padding:clamp(14px,2.5vh,40px) 20px 12px}
.kick{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--quiet);display:flex;align-items:center;gap:10px}
.kick i{display:inline-block;width:22px;height:2px;background:var(--ink)}
h1{font-size:clamp(1.6rem,3vw,2.4rem);line-height:1.08;letter-spacing:-.03em;font-weight:800;margin:10px 0 0}
.lead{font-size:clamp(.98rem,1.4vw,1.1rem);color:var(--quiet);max-width:62ch;margin:0}
.lead b{color:var(--ink);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin:22px 0 0;font-size:.82rem;color:var(--quiet)}
.meta span{display:inline-flex;align-items:center;gap:7px}
.meta i{width:6px;height:6px;border-radius:50%;background:var(--flow);display:inline-block}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:clamp(14px,2.5vh,32px) 0 10px;flex-wrap:wrap}
.sect h2{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--quiet);margin:0}
.sect p{margin:0;font-size:.8rem;color:var(--quiet)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.cards{grid-template-columns:1fr}}
.card{position:relative;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:0;cursor:pointer;overflow:hidden;
  transition:border-color .2s,transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s;animation:rise .6s cubic-bezier(.2,.7,.2,1) both;display:flex;flex-direction:column}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
.card:hover,.card:focus-visible{border-color:var(--ink);transform:translateY(-3px);box-shadow:0 14px 30px rgba(20,20,20,.08);outline:none}
.art{height:150px;background:var(--soft);border-bottom:1px solid var(--line);display:block;width:100%}
.cb{padding:10px 14px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.q{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--quiet);display:flex;justify-content:space-between;gap:8px}
.q .f{font-family:"JetBrains Mono",monospace;letter-spacing:0;text-transform:none}
.card h3{margin:2px 0 0;font-size:1.04rem;letter-spacing:-.015em}
.card p{margin:0;font-size:.82rem;line-height:1.4;color:var(--quiet)}
.go{margin-top:auto;padding-top:6px;display:flex;align-items:center;justify-content:space-between;font-size:.8rem;font-weight:600}
.go .arrow{width:24px;height:24px;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;transition:background .2s,color .2s,border-color .2s}
.card:hover .go .arrow{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.closing{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px 18px;border:1px dashed var(--dim);border-radius:14px;font-size:.86rem;color:var(--quiet);animation:rise .6s .24s cubic-bezier(.2,.7,.2,1) both}
.closing b{color:var(--ink)}
.closing .num{font-family:"JetBrains Mono",monospace;font-size:.72rem;font-weight:700;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--panel)}
.keys{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:.76rem;color:var(--quiet)}
kbd{font-family:"JetBrains Mono",monospace;font-size:.7rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel);color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* art animations */
.route-dot{offset-path:path('M24 112 C 90 112, 110 52, 170 60 S 260 108, 330 44');animation:drive 4.5s cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes drive{0%{offset-distance:0%}70%,100%{offset-distance:100%}}
.flow-dot{animation:flow 3.2s linear infinite}
@keyframes flow{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
.bar-g{transform-box:fill-box;transform-origin:bottom;animation:grow 3.6s cubic-bezier(.2,.7,.2,1) infinite}
@keyframes grow{0%{transform:scaleY(.15)}35%,85%{transform:scaleY(1)}100%{transform:scaleY(.15)}}
@media (prefers-reduced-motion:reduce){.card,.closing,.route-dot,.flow-dot,.bar-g{animation:none}}
.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(10px);z-index:60;background:var(--ink);color:var(--panel);font-size:.78rem;font-weight:600;padding:8px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.hint.show{opacity:1;transform:translateX(-50%)}
.cards{grid-template-columns:repeat(6,minmax(0,1fr))}
.cards .card{grid-column:span 2}.cards .card:nth-child(4){grid-column:2 / span 2}
@media (max-width:900px){.cards{grid-template-columns:1fr}.cards .card,.cards .card:nth-child(4){grid-column:auto}}
.card:nth-child(4){animation-delay:.24s}.card:nth-child(5){animation-delay:.32s}
.card.ec .q{color:#1d4e89}
.art{height:clamp(56px,calc(20vh - 84px),120px)}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.9}50%{transform:scale(1.15);opacity:.4}}
.mseg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel);flex:none}
.mseg button{font:inherit;font-size:.74rem;font-weight:600;color:var(--quiet);background:transparent;border:0;border-radius:999px;padding:5px 11px;cursor:pointer}
.mseg button.on{background:var(--gate);color:#fff}
.gnav{display:none;align-items:center;gap:6px;flex:none}
body.guided .gnav{display:inline-flex}
.gnav span{font-family:"JetBrains Mono",monospace;font-size:.76rem;color:var(--quiet);min-width:44px;text-align:center}
.gstrip{position:fixed;left:0;right:0;top:var(--top);height:3px;z-index:49;background:transparent;display:none}
body.guided .gstrip{display:block}
.gstrip i{display:block;height:100%;background:var(--gate);width:0;transition:width .35s cubic-bezier(.2,.7,.2,1)}
@media (max-width:1100px){.tabs .t{display:none}}
@media (max-width:820px){.mseg{display:none}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>
<body class="guided">
<header class="top">
  <button class="brand" id="home" aria-label="Zur Startseite"><span class="mono">JA</span><span><b>Jorge Aguilar</b><span>Head of Fleet Planning &amp; Lifecycle Management · 12.11.2026</span></span></button>
  <nav class="tabs" id="tabs" aria-label="Ansichten">

<main>
<section class="view on" id="welcome" aria-label="Start">
  <div class="hero">
    <div class="kick"><i></i>Europcar Mobility Group · Gespräch am 12. November 2026</div>
    <h1>Head of Fleet Planning &amp; Lifecycle Management</h1>

    <div class="sect"><h2>Fünf Ansichten · ein roter Faden</h2><p>Klicken oder <kbd>1</kbd>–<kbd>5</kbd></p></div>
    <div class="cards">
      <button class="card" data-v="1">
        <svg class="art" viewBox="0 0 360 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <path d="M24 112 C 90 112, 110 52, 170 60 S 260 108, 330 44" fill="none" stroke="#e3e0da" stroke-width="12" stroke-linecap="round"/>
          <path d="M24 112 C 90 112, 110 52, 170 60 S 260 108, 330 44" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="7 7"/>
          <g fill="#fff" stroke="#1a1a1a" stroke-width="2.2"><circle cx="70" cy="104" r="6"/><circle cx="168" cy="60" r="6"/><circle cx="246" cy="92" r="6"/><circle cx="318" cy="50" r="6"/></g>

          <g font-family="Inter" font-size="10" font-weight="700" fill="#6b6b6b"><text x="52" y="136">Wolt</text><text x="152" y="40">Bolt</text><text x="234" y="124">Bliq</text><text x="282" y="30">Nexio</text></g>
          <g><rect x="22" y="14" width="40" height="7" rx="3.5" fill="#3f46b0" opacity=".75"/><rect x="22" y="25" width="54" height="7" rx="3.5" fill="#4f8a8c" opacity=".75"/><rect x="22" y="36" width="64" height="7" rx="3.5" fill="#13804f" opacity=".75"/></g>

          <circle class="pulse" cx="180" cy="52" r="26" fill="#eef0fb"/>
          <circle cx="180" cy="52" r="19" fill="#3f46b0"/><text x="180" y="56.5" text-anchor="middle" font-family="Inter" font-size="12" font-weight="800" fill="#fff">JA</text>
          <g fill="#fff" stroke="#1a1a1a" stroke-width="1.8"><circle cx="96" cy="112" r="13"/><circle cx="150" cy="118" r="13"/><circle cx="210" cy="118" r="13"/><circle cx="264" cy="112" r="13"/></g>
          <g font-family="JetBrains Mono" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle"><text x="96" y="115.5">1</text><text x="150" y="121.5">2</text><text x="210" y="121.5">3</text><text x="264" y="115.5">4</text></g>

        <div class="cb">
          <div class="q"><span>02 · Führung</span></div>
          <h3>People Management</h3>
          <p>Vier direkte Mitarbeitende bei Bliq, meine Arbeitsweise im 1:1 und mein Ansatz für das Team bei Europcar.</p>
          <div class="go"><span>Ansicht öffnen</span><span class="arrow"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></div>
        </div>
      </button>
      <button class="card" data-v="3">
        <svg class="art" viewBox="0 0 360 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <g fill="#fff" stroke="#e3e0da"><rect x="18" y="16" width="70" height="20" rx="5"/><rect x="18" y="42" width="70" height="20" rx="5"/><rect x="18" y="68" width="70" height="20" rx="5"/><rect x="18" y="94" width="70" height="20" rx="5"/><rect x="18" y="120" width="70" height="20" rx="5"/></g>
          <g><rect x="18" y="16" width="4" height="20" rx="2" fill="#5d7899"/><rect x="18" y="42" width="4" height="20" rx="2" fill="#4f8a8c"/><rect x="18" y="68" width="4" height="20" rx="2" fill="#7f7aa8"/><rect x="18" y="94" width="4" height="20" rx="2" fill="#a08a5a"/><rect x="18" y="120" width="4" height="20" rx="2" fill="#a07068"/></g>
          <g fill="none" stroke-width="2" stroke-linecap="round" class="flow-dot" stroke-dasharray="2 10">
            <path d="M88 26 C 130 26,130 78,160 78" stroke="#5d7899"/><path d="M88 52 C 130 52,130 78,160 78" stroke="#4f8a8c"/><path d="M88 78 L 160 78" stroke="#7f7aa8"/><path d="M88 104 C 130 104,130 78,160 78" stroke="#a08a5a"/><path d="M88 130 C 130 130,130 78,160 78" stroke="#a07068"/>
            <path d="M226 78 C 256 78,256 40,290 40" stroke="#13804f"/><path d="M226 78 L 290 78" stroke="#13804f"/><path d="M226 78 C 256 78,256 116,290 116" stroke="#13804f"/></g>

          <circle cx="193" cy="78" r="9" fill="#13804f" opacity=".2" stroke="#13804f" stroke-width="1.5"/>
          <g fill="#fff" stroke="#e3e0da"><rect x="290" y="30" width="52" height="20" rx="5"/><rect x="290" y="68" width="52" height="20" rx="5"/><rect x="290" y="106" width="52" height="20" rx="5"/></g>

        </svg>
        <div class="cb">
          <div class="q"><span>03 · Nexio Fleet in der Praxis</span></div>
          <h3>Nexio Fleet: Daten integrieren</h3>
          <p>Wie getrennte Quellen zu einer gemeinsamen Datenbasis, gemeinsamen KPIs und Entscheidungen werden. Mit Umschalter auf Europcar.</p>
          <div class="go"><span>Ansicht öffnen</span><span class="arrow"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></div>

          <rect class="bar-g" style="animation-delay:.36s" x="172" y="60" width="34" height="10" rx="4" fill="#13804f"/>
          <rect class="bar-g" style="animation-delay:.48s" x="218" y="52" width="34" height="8" rx="4" fill="#13804f"/>
          <rect class="bar-g" style="animation-delay:.6s" x="264" y="52" width="34" height="44" rx="4" fill="#1a1a1a"/>
          <g>

        </svg>
        <div class="cb">
          <div class="q"><span>04 · Business Intelligence</span></div>
          <h3>Fallbeispiel Flotten-P&amp;L</h3>
          <p>TCO je Fahrzeug, Flotten-P&amp;L, Standzeit und Auslastung sowie Szenarien an einer illustrativen Flotte mit 48 Fahrzeugen.</p>
          <div class="go"><span>Ansicht öffnen</span><span class="arrow"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></div>
        </div>
      </button>
      <button class="card ec" data-v="5">
        <svg class="art" viewBox="0 0 360 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <g fill="#fff" stroke="#c9d6e8"><rect x="22" y="92" width="94" height="38" rx="8"/><rect x="133" y="92" width="94" height="38" rx="8"/><rect x="244" y="92" width="94" height="38" rx="8"/></g>
          <g fill="#1d4e89"><rect x="22" y="92" width="94" height="4" rx="2"/><rect x="133" y="92" width="94" height="4" rx="2"/><rect x="244" y="92" width="94" height="4" rx="2"/></g>
          <g fill="none" stroke="#1d4e89" stroke-width="1.8" class="flow-dot" stroke-dasharray="2 8"><path d="M180 58 C 180 76, 69 72, 69 92"/><path d="M180 58 L 180 92"/><path d="M180 58 C 180 76, 291 72, 291 92"/></g>
          <rect x="118" y="22" width="124" height="36" rx="18" fill="#1d4e89"/><text x="180" y="44.5" text-anchor="middle" font-family="Inter" font-size="11.5" font-weight="700" fill="#fff">Analytics Hub</text>
          <g font-family="Inter" font-size="9.5" font-weight="700" fill="#1d4e89" text-anchor="middle"><text x="69" y="117">Daten</text><text x="180" y="117">Lebenszyklus</text><text x="291" y="117">Planung</text></g>
        </svg>
        <div class="cb">
          <div class="q"><span>05 · Abschluss</span></div>
          <h3>Mein Beitrag bei Europcar</h3>
          <p>Mein Verständnis der Rolle, wie ich vorgehen würde und was ich mitbringe.</p>
          <div class="go"><span>Ansicht öffnen</span><span class="arrow"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></div>
        </div>
      </button>
    </div>
    <div class="keys"><span><kbd>&rarr;</kbd> / <kbd>&larr;</kbd> weiter / zurück</span><span><kbd>1</kbd>–<kbd>5</kbd> Ansicht · <kbd>0</kbd> Start</span><span><kbd>G</kbd> Geführt / Frei</span><span><kbd>F</kbd> Vollbild der Grafik</span><span><kbd>I</kbd> Details ein/aus</span></div>
  </div>

<section class="view" id="v1" aria-label="Werdegang"><iframe title="Werdegang" allow="fullscreen" allowfullscreen></iframe></section>
<section class="view" id="v2" aria-label="People Management"><iframe title="People Management" allow="fullscreen" allowfullscreen></iframe></section>
<section class="view" id="v3" aria-label="Datenplattform"><iframe title="Nexio Fleet: Datenfluss" allow="fullscreen" allowfullscreen></iframe></section>
<section class="view" id="v4" aria-label="Business Intelligence"><iframe title="Business Intelligence" allow="fullscreen" allowfullscreen></iframe></section>
<section class="view" id="v5" aria-label="Mein Beitrag bei Europcar"><iframe title="Mein Beitrag bei Europcar" allow="fullscreen" allowfullscreen></iframe></section>
</main>
<div class="hint" id="hint"></div>

<script>
var SRC=[null,/*P1*/,/*P2*/,/*P3*/,/*P4*/,/*P5*/];
(function(){
var N=5,cur=0,views=[0,1,2,3,4,5].map(function(i){return document.getElementById(i?'v'+i:'welcome')});
var NAMES=['Start','Werdegang','People Management','Datenplattform','Business Intelligence','Mein Beitrag bei Europcar'];
/* Guided mode: 12 core steps [view, step index, label], aligned with deck v1.2 / script DE-v1.3 */
var GUIDE=[[1,0,'Werdegang · Überblick'],[1,5,'Werdegang · Roter Faden'],[2,0,'People · Erfahrung bei Bliq'],[2,2,'People · Ansatz bei Europcar'],
  [3,1,'Daten · Die Herausforderung'],[3,5,'Daten · Mein Beitrag'],[4,1,'BI · TCO je Fahrzeug'],[4,2,'BI · Flotten-P&L'],[4,3,'BI · Standzeit & Auslastung'],[4,4,'BI · Szenarien'],
  [5,0,'Europcar · Mein Verständnis'],[5,2,'Europcar · Zusammengefasst']];
var guided=true,gi=-1,pend={};
var tabs=[].slice.call(document.querySelectorAll('#tabs button'));
var hint=document.getElementById('hint'),hT;
function flash(t){hint.textContent=t;hint.classList.add('show');clearTimeout(hT);hT=setTimeout(function(){hint.classList.remove('show')},1500)}
function frame(i){return views[i].querySelector('iframe')}
function setStepIn(i,s){var f=frame(i);try{if(f.dataset.ready&&f.contentWindow.__goto){f.contentWindow.__goto(s);return}}catch(e){}pend[i]=s}
function go(i,opts){opts=opts||{};if(i<0||i>N)return;var prev=cur;cur=i;
  views.forEach(function(v,k){v.classList.toggle('on',k===i)});
  tabs.forEach(function(b){b.classList.toggle('on',+b.dataset.v===i)});
  if(i>0){var f=frame(i);if(!f.dataset.loaded){f.dataset.loaded='1';f.addEventListener('load',function(){wire(i);f.dataset.ready='1';
        if(pend[i]!=null){var s=pend[i];delete pend[i];try{f.contentWindow.__goto(s)}catch(e){}}},{once:true});f.srcdoc=SRC[i]}
    else if(opts.toEnd)toEnd(i);
    setTimeout(function(){try{f.contentWindow.focus()}catch(e){}},60)}
  else{window.focus()}
  try{if(location.hash!=='#'+i)history.replaceState(null,'','#'+i)}catch(e){}
  if(prev!==i&&opts.flash!==false)flash((i?'0'+i+' · ':'')+NAMES[i])}
function gUpd(){document.getElementById('gN').textContent=(gi<0?'–':gi+1)+' / '+GUIDE.length;document.getElementById('gBar').style.width=((gi+1)/GUIDE.length*100)+'%'}
function gGo(g){if(g<-1)return;if(g>=GUIDE.length){flash('Ende der Präsentation');return}
  gi=g;gUpd();if(g<0){go(0,{flash:false});flash('Start');return}
  var G=GUIDE[g];go(G[0],{flash:false});setStepIn(G[0],G[1]);flash((g+1)+' / '+GUIDE.length+' · '+G[2])}
function firstGuideOf(v){for(var k=0;k<GUIDE.length;k++)if(GUIDE[k][0]===v)return k;return -1}
function setMode(gd){guided=gd;document.body.classList.toggle('guided',gd);
  document.getElementById('mG').classList.toggle('on',gd);document.getElementById('mF').classList.toggle('on',!gd);
  document.getElementById('mG').setAttribute('aria-pressed',gd);document.getElementById('mF').setAttribute('aria-pressed',!gd);
  if(gd){gi=cur===0?-1:firstGuideOf(cur);gUpd()}
  flash(gd?'Geführter Modus · '+GUIDE.length+' Kernschritte':'Freier Modus · alle Schritte')}
function jump(v){if(guided)gGo(v===0?-1:firstGuideOf(v));else go(v)}
function state(i){try{var d=frame(i).contentDocument,t=d.getElementById('capN').textContent.split('/');return{s:+t[0],n:+t[1]}}catch(e){return null}}
function toEnd(i){try{var w=frame(i).contentWindow,st=state(i);if(!st)return;for(var k=st.s;k<st.n;k++)w.document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}))}catch(e){}}
function isInput(e){return e.target&&/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)}
function wire(i){var w=frame(i).contentWindow;
  w.addEventListener('keydown',function(e){var k=e.key;if(isInput(e)||!e.isTrusted&&!guided)return;
    if(/^[0-5]$/.test(k)){e.preventDefault();e.stopImmediatePropagation();jump(+k);return}
    if(k==='g'||k==='G'){e.preventDefault();e.stopImmediatePropagation();setMode(!guided);return}
    var fwd=(k==='ArrowRight'||k===' '||k==='PageDown'),back=(k==='ArrowLeft'||k==='PageUp');
    if(guided&&(fwd||back)){e.preventDefault();e.stopImmediatePropagation();gGo(gi+(fwd?1:-1));return}
    var st=state(i);if(!st)return;
    if(fwd&&st.s>=st.n){e.preventDefault();e.stopImmediatePropagation();if(i<N)go(i+1);else flash('Ende der Präsentation')}
    else if(back&&st.s<=1){e.preventDefault();e.stopImmediatePropagation();go(i-1,{toEnd:true})}
  },true)}
tabs.forEach(function(b){b.onclick=function(){jump(+b.dataset.v)}});
[].forEach.call(document.querySelectorAll('.card'),function(c){c.onclick=function(){jump(+c.dataset.v)}});
document.getElementById('home').onclick=function(){jump(0)};
document.getElementById('mG').onclick=function(){if(!guided)setMode(true)};
document.getElementById('mF').onclick=function(){if(guided)setMode(false)};
document.getElementById('gPrev').onclick=function(){gGo(gi-1)};
document.getElementById('gNext').onclick=function(){gGo(gi+1)};
document.addEventListener('keydown',function(e){var k=e.key;if(isInput(e))return;
  if(/^[0-5]$/.test(k)){jump(+k);return}
  if(k==='g'||k==='G'){setMode(!guided);return}
  var fwd=(k==='ArrowRight'||k===' '||k==='PageDown'||(k==='Enter'&&e.target===document.body)),back=(k==='ArrowLeft'||k==='PageUp');
  if(guided&&(fwd||back)){e.preventDefault();gGo(gi+(fwd?1:-1));return}
  if(cur===0&&fwd){e.preventDefault();go(1)}
  if(cur>0&&(fwd||back)){try{frame(cur).contentWindow.focus()}catch(x){}}});
var IC={full:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg>',
  exit:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5V6H2.5M13.5 6H10V2.5M10 13.5V10h3.5M2.5 10H6v3.5"/></svg>'};
var fsb=document.getElementById('fsb');function upd(){var f=!!document.fullscreenElement;fsb.innerHTML=f?IC.exit:IC.full;fsb.title=f?'Vollbild beenden':'Präsentation im Vollbild'}
fsb.onclick=function(){if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();else if(document.exitFullscreen)document.exitFullscreen()};
document.addEventListener('fullscreenchange',upd);upd();
window.__guide=gGo;window.__mode=setMode;
gUpd();
var h=0;try{h=parseInt((location.hash||'#0').slice(1),10)}catch(e){}
if(!isNaN(h)&&h>0&&h<=N){var fg=firstGuideOf(h);gi=fg;gUpd();go(h,{flash:false});setStepIn(h,GUIDE[fg][1])}else go(0,{flash:false});
})();
</script>
</body>
</html>
